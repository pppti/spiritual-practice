name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gradle 2>&1 | tail -3

      - name: Install Android SDK packages
        run: |
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" --sdk_root=$ANDROID_SDK_ROOT 2>&1 | tail -5
          else
            echo "SDK not found at expected path, downloading..."
            mkdir -p $HOME/android-sdk/cmdline-tools
            curl -sL -o /tmp/cmt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/cmt.zip -d $HOME/android-sdk/cmdline-tools
            mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
            yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5
            echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          fi

      - name: Build APK
        run: |
          cd android
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$HOME/android-sdk}" > local.properties
          gradle wrapper --gradle-version 8.7 2>&1
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spiritual-practice-apk
          path: android/app/build/outputs/apk/release/*.apk
